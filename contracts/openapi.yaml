openapi: 3.1.0
info:
  title: DataScout API
  version: 1.0.0
  summary: Search, inspect, and compare public datasets.
  description: |
    Contract v1 for the DataScout MVP. All routes require a Cognito access
    token with the operation-specific `datascout-api` scope. Search results
    are owned by the authenticated Cognito subject; dataset detail is public
    metadata available to authenticated users.

    This OpenAPI 3.1 document is the canonical contract for the mock server,
    generated frontend types, and documentation. It is not imported into API
    Gateway. The SAM template defines deployed routes and Cognito authorization;
    contract parity is checked in CI.
servers:
  - url: /
    description: Relative API base; deployment environments provide the origin and stage.
tags:
  - name: Search
    description: Dataset search and cached result retrieval.
  - name: Datasets
    description: Public normalized dataset detail.
  - name: Compare
    description: Side-by-side comparison of known public datasets.
paths:
  /search:
    post:
      operationId: searchDatasets
      tags: [Search]
      summary: Search public dataset catalogs
      description: |
        Extracts requirements from the query, searches enabled sources, and
        returns ranked results with evidence and deterministic score details.
        A source failure is reported as partial coverage where other sources
        return results. If all required upstream sources fail, the request
        returns 503 with `upstream_unavailable`. The query is limited to
        1,000 characters after trimming.
      security:
        - cognito:
            - datascout-api/search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Search completed, including any partial source status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              examples:
                search-results:
                  summary: Search returned matching datasets.
                  externalValue: ./fixtures/search-results.json
                search-partial:
                  summary: Search returned results while one source failed.
                  externalValue: ./fixtures/search-partial.json
                search-no-match:
                  summary: Search completed without matching datasets.
                  externalValue: ./fixtures/search-no-match.json
                search-clarification:
                  summary: Search needs a more specific topic.
                  externalValue: ./fixtures/search-clarification.json
                search-refused:
                  summary: Search request was refused.
                  externalValue: ./fixtures/search-refused.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/ExtractionFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /results/{request_id}:
    get:
      operationId: getSearchResult
      tags: [Search]
      summary: Retrieve an owned cached search result
      description: |
        Returns a cached search response only to its owner. A request ID owned
        by another user returns the same 404 response as a missing request.
      security:
        - cognito:
            - datascout-api/read
      parameters:
        - name: request_id
          in: path
          required: true
          description: Opaque search request identifier.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Cached search response owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /dataset/{dataset_id}:
    get:
      operationId: getDatasetDetail
      tags: [Datasets]
      summary: Retrieve public dataset details
      description: |
        Returns normalized public metadata, provenance, validation evidence,
        access guidance, and next steps. The complete dataset ID must be
        percent-encoded as a single path parameter by clients; deployment
        testing must confirm encoded source IDs (including slash characters)
        are routed correctly.
      security:
        - cognito:
            - datascout-api/read
      parameters:
        - name: dataset_id
          in: path
          required: true
          description: |
            Canonical `{source}:{native_id}`. Percent-encode the entire value
            as one path segment; for example, encode `/` in a Hugging Face ID.
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_-]*:[A-Za-z0-9][A-Za-z0-9._/-]*$'
      responses:
        '200':
          description: Normalized public dataset details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /compare:
    post:
      operationId: compareDatasets
      tags: [Compare]
      summary: Compare two to four public datasets
      description: |
        Returns side-by-side normalized metadata and evidence for two to four
        known public dataset IDs. The response does not declare a winner.
      security:
        - cognito:
            - datascout-api/compare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompareRequest'
      responses:
        '200':
          description: Side-by-side dataset details and evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompareResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    cognito:
      type: oauth2
      description: |
        Cognito User Pool access token obtained by Authorization Code with
        PKCE. Replace `{cognitoDomain}` with the configured User Pool domain
        before generating environment-specific client configuration.
      flows:
        authorizationCode:
          authorizationUrl: https://{cognitoDomain}/oauth2/authorize
          tokenUrl: https://{cognitoDomain}/oauth2/token
          scopes:
            datascout-api/search: Submit dataset searches.
            datascout-api/read: Read owned search results and public dataset details.
            datascout-api/compare: Compare known public dataset IDs.

  schemas:
    ExtractedRequirements:
      $ref: ./json-schema/ExtractedRequirements.schema.json
    SearchOutcome:
      $ref: ./json-schema/SearchOutcome.schema.json
    ClarificationReasonCode:
      $ref: ./json-schema/ClarificationReasonCode.schema.json
    Clarification:
      $ref: ./json-schema/Clarification.schema.json
    RefusalReasonCode:
      $ref: ./json-schema/RefusalReasonCode.schema.json
    Refusal:
      $ref: ./json-schema/Refusal.schema.json
    RequirementType:
      $ref: ./json-schema/RequirementType.schema.json
    RequirementPriority:
      $ref: ./json-schema/RequirementPriority.schema.json
    SourceSpan:
      $ref: ./json-schema/SourceSpan.schema.json
    Requirement:
      $ref: ./json-schema/Requirement.schema.json
    VerificationLevel:
      $ref: ./json-schema/VerificationLevel.schema.json
    DatasetProvenance:
      $ref: ./json-schema/DatasetProvenance.schema.json
    Dataset:
      $ref: ./json-schema/Dataset.schema.json
    Evidence:
      $ref: ./json-schema/Evidence.schema.json
    RequirementMatchStatus:
      $ref: ./json-schema/RequirementMatchStatus.schema.json
    RequirementMatch:
      $ref: ./json-schema/RequirementMatch.schema.json
    ScoreComponentName:
      $ref: ./json-schema/ScoreComponentName.schema.json
    ScoreComponent:
      $ref: ./json-schema/ScoreComponent.schema.json
    ScoreBreakdown:
      $ref: ./json-schema/ScoreBreakdown.schema.json
    ContractVersions:
      $ref: ./json-schema/ContractVersions.schema.json
    SourceStatus:
      $ref: ./json-schema/SourceStatus.schema.json
    QualityCheck:
      $ref: ./json-schema/QualityCheck.schema.json
    SearchRequest:
      $ref: ./json-schema/SearchRequest.schema.json
    SearchResult:
      $ref: ./json-schema/SearchResult.schema.json
    SearchResponse:
      $ref: ./json-schema/SearchResponse.schema.json
    CompareRequest:
      $ref: ./json-schema/CompareRequest.schema.json
    CompareDataset:
      $ref: ./json-schema/CompareDataset.schema.json
    CompareResponse:
      $ref: ./json-schema/CompareResponse.schema.json
    ComplementaryDatasetSuggestion:
      $ref: ./json-schema/ComplementaryDatasetSuggestion.schema.json
    DatasetDetail:
      $ref: ./json-schema/DatasetDetail.schema.json
    ErrorObject:
      $ref: ./json-schema/ErrorObject.schema.json
    ErrorCode:
      $ref: ./json-schema/ErrorCode.schema.json

  responses:
    BadRequest:
      description: Request body or path parameter does not meet contract v1.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorObject'
          examples:
            error-invalid_request:
              summary: Request is invalid.
              externalValue: ./fixtures/errors/error-invalid_request.json
    Unauthorized:
      description: Missing, expired, malformed, or invalid Cognito access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorObject'
          examples:
            error-unauthorized:
              summary: Authentication is required.
              externalValue: ./fixtures/errors/error-unauthorized.json
    Forbidden:
      description: Cognito access token does not include the required route scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorObject'
          examples:
            error-forbidden:
              summary: Caller lacks the route scope.
              externalValue: ./fixtures/errors/error-forbidden.json
    NotFound:
      description: Resource does not exist, is expired, or is not owned by caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorObject'
          examples:
            error-not_found:
              summary: Resource was not found.
              externalValue: ./fixtures/errors/error-not_found.json
    ContentTooLarge:
      description: Request body exceeds a configured API Gateway limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorObject'
          examples:
            error-payload_too_large:
              summary: Request body exceeds the size limit.
              externalValue: ./fixtures/errors/error-payload_too_large.json
    TooManyRequests:
      description: Request was throttled.
      headers:
        Retry-After:
          description: Seconds to wait before retrying, when supplied.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorObject'
          examples:
            error-rate_limited:
              summary: Request was rate limited.
              externalValue: ./fixtures/errors/error-rate_limited.json
    InternalError:
      description: Unexpected internal failure; details are not exposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorObject'
          examples:
            error-internal_error:
              summary: Unexpected internal failure.
              externalValue: ./fixtures/errors/error-internal_error.json
    ExtractionFailed:
      description: Requirement extraction failed after retries.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorObject'
          examples:
            error-extraction_failed:
              summary: Extraction failed.
              externalValue: ./fixtures/errors/error-extraction_failed.json
    ServiceUnavailable:
      description: Required service is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorObject'
          examples:
            error-upstream_unavailable:
              summary: All required upstream services are unavailable.
              externalValue: ./fixtures/errors/error-upstream_unavailable.json
    Timeout:
      description: Request processing exceeded its time limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorObject'
          examples:
            error-timeout:
              summary: Request timed out.
              externalValue: ./fixtures/errors/error-timeout.json
