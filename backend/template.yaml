AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: DataScout MVP Backend - REST API, Cognito, DynamoDB, S3, and Lambdas

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment target environment.
  CorsAllowedOrigin:
    Type: String
    Default: 'http://localhost:5173'
    Description: Allowed CORS origin for frontend applications (defaults to local dev http://localhost:5173). Required for cross-origin browser requests.
  AmplifyOrigin:
    Type: String
    Default: ''
    Description: Optional deployed frontend URL (e.g. AWS Amplify or custom domain) for Cognito OAuth redirects.
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARN, ERROR]
    Description: Logging severity level.
  LlmProvider:
    Type: String
    Default: fake
    AllowedValues: [fake, cassette]
    Description: LLM provider for fixture-backed local and deterministic replay modes.
  KaggleApiSecretArn:
    Type: String
    Default: ''
    Description: Optional ARN of a Secrets Manager secret whose SecretString is the Kaggle API token.
  DataGovInApiSecretArn:
    Type: String
    Default: ''
    Description: Optional ARN of a Secrets Manager secret whose SecretString is the data.gov.in API key.
  HuggingFaceApiSecretArn:
    Type: String
    Default: ''
    Description: Optional ARN of a Secrets Manager secret whose SecretString is the Hugging Face token.

Conditions:
  HasAmplifyOrigin: !Not [!Equals [!Ref AmplifyOrigin, '']]

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        NODE_OPTIONS: --enable-source-maps
        ENVIRONMENT: !Ref Environment
        LOG_LEVEL: !Ref LogLevel
        LLM_PROVIDER: !Ref LlmProvider
        RESULTS_TABLE_NAME: !Ref ResultsTable
        DATASETS_TABLE_NAME: !Ref DatasetsTable
        CATALOG_TABLE_NAME: !Ref CatalogTable
        SNAPSHOTS_BUCKET_NAME: !Ref SnapshotsBucket
        CONTRACT_VERSION: 1.0.0
        PROMPT_VERSION: extract-v1
        SCHEMA_VERSION: 1.0.0
        SCORING_VERSION: score-v1
        MODEL_ID: fake-datascout-v0.1

Resources:
  # ---------------------------------------------------------------------------
  # Cognito User Pool, Resource Server, and App Client
  # ---------------------------------------------------------------------------
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub datascout-users-${Environment}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  CognitoResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref CognitoUserPool
      Identifier: datascout-api
      Name: DataScout API
      Scopes:
        - ScopeName: search
          ScopeDescription: Run project requirement extraction and dataset search
        - ScopeName: read
          ScopeDescription: Read cached search results and dataset details
        - ScopeName: compare
          ScopeDescription: Run side-by-side dataset comparisons

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: CognitoResourceServer
    Properties:
      ClientName: !Sub datascout-web-client-${Environment}
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      AllowedOAuthFlows: [code]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
        - datascout-api/search
        - datascout-api/read
        - datascout-api/compare
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: !If
        - HasAmplifyOrigin
        - - http://localhost:3000
          - http://localhost:3000/
          - http://localhost:5173
          - http://localhost:5173/
          - !Ref AmplifyOrigin
        - - http://localhost:3000
          - http://localhost:3000/
          - http://localhost:5173
          - http://localhost:5173/
      LogoutURLs: !If
        - HasAmplifyOrigin
        - - http://localhost:3000
          - http://localhost:3000/
          - http://localhost:5173
          - http://localhost:5173/
          - !Ref AmplifyOrigin
        - - http://localhost:3000
          - http://localhost:3000/
          - http://localhost:5173
          - http://localhost:5173/
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub datascout-${AWS::AccountId}-${AWS::Region}-${Environment}
      UserPoolId: !Ref CognitoUserPool

  # ---------------------------------------------------------------------------
  # API Gateway REST API with Cognito Authorizer & Gateway Responses
  # ---------------------------------------------------------------------------
  ApiGatewayApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Name: !Sub datascout-api-${Environment}
      Cors:
        AllowOrigin: !Sub "'${CorsAllowedOrigin}'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        AllowMethods: "'GET,POST,OPTIONS'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn
            Identity:
              Header: Authorization
        AddDefaultAuthorizerToCorsPreflight: false
      GatewayResponses:
        REQUEST_TOO_LARGE:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${CorsAllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
              Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
          ResponseTemplates:
            application/json: '{"code":"payload_too_large","message":"Request body exceeds the allowed size.","request_id":"$context.requestId","retryable":false}'
        INTEGRATION_TIMEOUT:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${CorsAllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
              Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
          ResponseTemplates:
            application/json: '{"code":"timeout","message":"The request timed out.","request_id":"$context.requestId","retryable":true}'
        UNAUTHORIZED:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${CorsAllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
              Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
          ResponseTemplates:
            application/json: '{"code":"unauthorized","message":"Authorization failed or missing credentials.","request_id":"$context.requestId","retryable":false}'
        ACCESS_DENIED:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${CorsAllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
              Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
          ResponseTemplates:
            application/json: '{"code":"forbidden","message":"Access denied: insufficient permissions or scopes.","request_id":"$context.requestId","retryable":false}'
        THROTTLED:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${CorsAllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
              Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
          ResponseTemplates:
            application/json: '{"code":"rate_limited","message":"Request throttled: rate limit exceeded.","request_id":"$context.requestId","retryable":true}'
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${CorsAllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
              Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
          ResponseTemplates:
            application/json: '{"code":"invalid_request","message":"Invalid request.","request_id":"$context.requestId","retryable":false}'
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${CorsAllowedOrigin}'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
              Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
          ResponseTemplates:
            application/json: '{"code":"internal_error","message":"An unexpected server error occurred.","request_id":"$context.requestId","retryable":false}'

  # ---------------------------------------------------------------------------
  # DynamoDB Storage
  # ---------------------------------------------------------------------------
  ResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub datascout-results-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  DatasetsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub datascout-datasets-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: dataset_id
          AttributeType: S
      KeySchema:
        - AttributeName: dataset_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  CatalogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub datascout-catalog-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  # ---------------------------------------------------------------------------
  # S3 Snapshot Storage
  # ---------------------------------------------------------------------------
  SnapshotsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub datascout-snapshots-${AWS::AccountId}-${AWS::Region}-${Environment}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldSnapshots
            Status: Enabled
            ExpirationInDays: 30

  # ---------------------------------------------------------------------------
  # Lambda Functions
  # ---------------------------------------------------------------------------
  SearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .aws-sam/minimal/SearchFunction
      Handler: dist/handlers/search.handler
      Description: POST /search - Natural language requirement extraction and candidate search
      Environment:
        Variables:
          KAGGLE_API_TOKEN_SECRET_ARN: !Ref KaggleApiSecretArn
          DATAGOVIN_API_KEY_SECRET_ARN: !Ref DataGovInApiSecretArn
          HUGGINGFACE_API_TOKEN_SECRET_ARN: !Ref HuggingFaceApiSecretArn
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        Search:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /search
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
              AuthorizationScopes:
                - datascout-api/search

  ResultsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .aws-sam/minimal/ResultsFunction
      Handler: dist/handlers/results.handler
      Description: GET /results/{request_id} - Owner-only cached search response retrieval
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        Results:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /results/{request_id}
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
              AuthorizationScopes:
                - datascout-api/read

  DatasetFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .aws-sam/minimal/DatasetFunction
      Handler: dist/handlers/dataset.handler
      Description: GET /dataset/{dataset_id} - Normalized public dataset detail
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        Dataset:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /dataset/{dataset_id}
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
              AuthorizationScopes:
                - datascout-api/read

  CompareFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .aws-sam/minimal/CompareFunction
      Handler: dist/handlers/compare.handler
      Description: POST /compare - Side-by-side comparison of 2 to 4 datasets
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        Compare:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGatewayApi
            Path: /compare
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
              AuthorizationScopes:
                - datascout-api/compare

  RefreshFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .aws-sam/minimal/RefreshFunction
      Handler: dist/handlers/refresh.handler
      Description: Scheduled catalog harvest and indicator indexing
      Environment:
        Variables:
          DATAGOVIN_API_KEY_SECRET_ARN: !Ref DataGovInApiSecretArn
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)
            Name: !Sub datascout-refresh-schedule-${Environment}
            Description: Daily dataset catalog refresh trigger
            Enabled: true

  SearchErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub datascout-search-errors-${Environment}
      AlarmDescription: Search Lambda reported one or more errors in five minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SearchFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  RefreshErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub datascout-refresh-errors-${Environment}
      AlarmDescription: Catalog refresh Lambda reported one or more errors in five minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RefreshFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiEndpoint:
    Description: HTTP base URL for the deployed REST API
    Value: !Sub https://${ApiGatewayApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub datascout-api-endpoint-${Environment}

  CognitoUserPoolId:
    Description: Cognito User Pool identifier
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub datascout-user-pool-id-${Environment}

  CognitoUserPoolClientId:
    Description: Cognito User Pool Public App Client identifier
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub datascout-user-pool-client-id-${Environment}

  CognitoHostedUiDomain:
    Description: Cognito managed login domain hostname for the public SPA client
    Value: !Sub datascout-${AWS::AccountId}-${AWS::Region}-${Environment}.auth.${AWS::Region}.amazoncognito.com

  CognitoUserPoolArn:
    Description: Cognito User Pool ARN
    Value: !GetAtt CognitoUserPool.Arn

  ResultsTableName:
    Description: DynamoDB Results and search cache table name
    Value: !Ref ResultsTable

  DatasetsTableName:
    Description: DynamoDB Normalized dataset detail table name
    Value: !Ref DatasetsTable

  SnapshotsBucketName:
    Description: S3 Snapshots and samples private bucket name
    Value: !Ref SnapshotsBucket
