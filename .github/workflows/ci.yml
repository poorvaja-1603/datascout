name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - "@datascout/contracts"
          - "@datascout/ai"
          - "@datascout/verify"
          - "@datascout/observability"
          - "@datascout/connectors"
          - "@datascout/backend"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=${{ matrix.workspace }}
      - run: npm test --workspace=${{ matrix.workspace }}
      - run: npm run lint --workspace=${{ matrix.workspace }}
      - run: npm run format:check --workspace=${{ matrix.workspace }}

  evaluation-corpus:
    name: Evaluation corpus integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python evals/validate_dataset.py
